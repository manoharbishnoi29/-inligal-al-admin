<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>AI Learning &middot; Illegal AI Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b5d55">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .logo { background: #000 url(icons/logo-128.png) center / cover no-repeat !important; }
    .logo svg { display: none; }
    .bar-wrap { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0; }
    .bar-fill { height: 100%; background: var(--primary); transition: width .4s ease; }
    .src-line { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
    .grid3 { display: grid; gap: 16px; }
    @media (min-width: 900px) { .grid3 { grid-template-columns: 1fr 1fr; } }
    .chunk-text { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
    .note { background: var(--accent-soft); color: var(--apk); border-radius: 10px; padding: 10px 12px; font-size: .88rem; margin-bottom: 14px; }
  </style>
  <script>
    (function () {
      var t = localStorage.getItem('ar-theme') ||
        (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="shell" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="logo" id="sideLogo"></div>
        <div><b>Illegal AI</b><small>Admin panel</small></div>
      </div>
      <nav class="nav" id="nav">
        <a href="index.html#dashboard" data-i="home">Dashboard</a>
        <a href="index.html#questions" data-i="list">Questions &amp; answers</a>
        <a href="index.html#unanswered" data-i="inbox">Unanswered</a>
        <a href="index.html#payments" data-i="check">Payments</a>
        <a href="index.html#chats" data-i="chat">Chats &amp; users</a>
        <a href="index.html#settings" data-i="edit">Premium settings</a>
        <a href="knowledge.html" data-i="bot" class="active">🧠 AI Learning</a>
      </nav>
      <div class="side-foot">
        <div class="who" id="who"></div>
        <button type="button" id="logoutBtn"></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <h1 id="title">🧠 AI Learning</h1>
        <button class="icon-btn" id="themeBtn"></button>
      </header>
      <main class="view" id="view"><div class="skeleton"></div><div class="skeleton"></div></main>
    </div>
  </div>
  <script type="module" src="js/knowledge.js"></script>
</body>
</html>
